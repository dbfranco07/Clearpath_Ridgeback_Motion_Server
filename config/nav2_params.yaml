# Nav2 parameters — no map_server, no AMCL (slam_toolbox owns map+TF).
# Holonomic controller. DWB -> /cmd_vel/nav_raw -> velocity_smoother ->
# /cmd_vel/nav (consumed by cmd_vel_mux). The smoother resamples the coarse
# 10 Hz DWB output into 20 Hz accel-bounded commands; wiring it out of this
# path (stock cmd_vel/cmd_vel_smoothed topics) is what makes motion jerky.
# Local costmap uses LiDAR only initially; depth pointcloud can be added later.

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    bond_timeout: 4.0
    attempt_respawn_reconnection: true
    bond_respawn_max_duration: 10.0
    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - velocity_smoother
      - waypoint_follower
      - bt_navigator

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /r100_0140/platform/odom/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    enable_groot_monitoring: false
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_path_longer_on_approach_bt_node

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    cmd_vel_topic: /cmd_vel/nav_raw
    odom_topic: /r100_0140/platform/odom/filtered
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      # 0.10 m (was 0.5): at the deliberately-slow 0.15 m/s cap, careful
      # doorway/corner threading legitimately creeps. Requiring 0.5 m of
      # motion within the 10 s window aborted the robot mid-maneuver even
      # when it WAS making slow progress. 0.10 m still catches a true stall
      # (a genuinely stuck robot won't move 10 cm in 10 s) and the
      # orchestrator's max_explore_time is the real anti-stuck backstop.
      required_movement_radius: 0.10
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.25
      # ~46° yaw tolerance. Frontier exploration doesn't care about exact
      # final heading; for mission landmarks the VLM re-frames the camera
      # anyway. Looser tolerance prevents end-of-leg yaw thrash.
      yaw_goal_tolerance: 0.8
      stateful: true

    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: false
      # Allow tiny reverse (-0.05 m/s) so DWB's lowest-cost rollout can
      # nudge the robot ~5-10 cm off a wall when it has parked too close
      # and every forward trajectory rolls through the inscribed (lethal)
      # band. Not enough velocity to be "driving backward" — just enough
      # to break loose. The behavior_server's backup recovery also benefits.
      min_vel_x: -0.05
      min_vel_y: -0.15
      max_vel_x: 0.15
      max_vel_y: 0.15
      max_vel_theta: 0.20
      min_speed_xy: 0.0
      max_speed_xy: 0.2
      min_speed_theta: 0.0
      acc_lim_x: 0.4
      acc_lim_y: 0.4
      # Angular accel halved vs translational. The drives are torque-rich
      # in yaw, so the default 0.4 rad/s² produced snappy jerks during
      # frontier replans. 0.20 ramps over ~1 s to max_vel_theta.
      acc_lim_theta: 0.20
      decel_lim_x: -0.4
      decel_lim_y: -0.4
      decel_lim_theta: -0.20
      # Trajectory count is the dominant DWB cost. 14*14*16 = 3136 rollouts,
      # each rolling the FULL rectangular footprint over the costmap
      # (ObstacleFootprint critic) for 2.5 s -> the controller cannot finish
      # within 100 ms on the Orin while SLAM/frontier/web share the CPU.
      # That missed 10 Hz loop is the #1 cause of the stuttering motion.
      # 10*8*12 = 960 rollouts (~70% fewer) lets it hold 10 Hz; the
      # velocity_smoother below fills in fine smoothness.
      vx_samples: 10
      vy_samples: 8
      vtheta_samples: 12
      # 2.5 s rollout. At max_vel_x 0.15 that's ~37 cm of forward
      # lookahead, enough for DWB to see and avoid a corner before the
      # footprint reaches it. The previous 1.7 s only looked 25 cm ahead
      # — barely past the front of the robot.
      sim_time: 2.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 1.0
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: true
      stateful: true
      # RotateToGoal is kept so the robot turns toward goals (helps SLAM
      # sweep angles) but at a low scale + low slowing_factor so the spin is
      # gentle, not the snappy 32-scale default. Angular max_vel / accel are
      # also low (see above). Oscillation is high to suppress flip-flop when
      # the frontier replan picks a different bearing.
      # ObstacleFootprint (not BaseObstacle) rolls the full rectangular
      # footprint over the costmap during trajectory scoring — required for
      # a holonomic base that strafes close to walls. BaseObstacle samples
      # only the center point and lets corners clip obstacles.
      critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      ObstacleFootprint.scale: 0.5
      ObstacleFootprint.sum_scores: false
      PathAlign.scale: 12.0
      PathAlign.forward_point_distance: 0.2
      GoalAlign.scale: 8.0
      GoalAlign.forward_point_distance: 0.2
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      # Lower scale + higher slowing_factor = gentler final alignment.
      # Frontier goals now arrive pre-aligned (atan2 heading), so this
      # critic mostly handles small corrections.
      RotateToGoal.scale: 3.0
      RotateToGoal.slowing_factor: 4.0
      RotateToGoal.lookahead_time: 1.5
      Oscillation.scale: 8.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 1.0
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      # Ridgeback R100 is ~0.96 × 0.80 m. The previous robot_radius:0.34
      # under-estimated the platform by ~25 cm in the lateral direction,
      # so DWB could plan paths that clipped door frames during holonomic
      # strafing. Use the actual rectangular footprint.
      footprint: "[[0.48, 0.40], [0.48, -0.40], [-0.48, -0.40], [-0.48, 0.40]]"
      # Padding MUST stay 0.0: field testing showed any padding (0.03-0.04)
      # pushes the inscribed/lethal radius past ~0.43 m, which leaves a real
      # doorway with under 1 free cell at center -> the robot creeps at the
      # threshold and cannot get out the door. The doors here are tighter than
      # the "1.5-2x width" estimate, so the inscribed radius must equal the true
      # half-width (0.40 m). Corner safety comes from the ObstacleFootprint
      # critic + inflation, NOT from padding.
      footprint_padding: 0.0
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /r100_0140/sensors/lidar2d_0/scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # inflation_radius 0.85 was the doorway/return-home killer: a 0.9 m
        # door has its ENTIRE width swallowed by inflation (needs >1.7 m to
        # leave any low-cost center), so the local controller could not find
        # an acceptable-cost path through openings and the robot stalled.
        # Hard collision safety comes from the real footprint + the
        # ObstacleFootprint critic, NOT from inflation -- so inflation only
        # needs to be a thin "prefer clearance" buffer. 0.45 is the smallest
        # sane value (must be >= inscribed radius 0.43). Steeper scaling (3.0)
        # keeps a navigable low-cost center down corridors and through doors.
        cost_scaling_factor: 3.0
        inflation_radius: 0.45
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 1.0
      rolling_window: false
      track_unknown_space: true
      footprint: "[[0.48, 0.40], [0.48, -0.40], [-0.48, -0.40], [-0.48, 0.40]]"
      # Match local: 0.0. Any padding inflates the inscribed radius past the
      # door's free center and the global plan can't form through it (robot
      # gets stuck at the doorway). Keep at the true half-width.
      footprint_padding: 0.0
      resolution: 0.05
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /r100_0140/sensors/lidar2d_0/scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # Global slightly larger than local (0.55 vs 0.45) so global paths
        # prefer the corridor centerline, while the local controller can still
        # squeeze closer when a doorway requires it. 0.60 was too much: it
        # inflated the full width of a real (tight) door so the global plan
        # couldn't thread it and the robot stalled at the threshold. Was 0.85,
        # which closed room openings entirely. 0.55 is the known-good value.
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      # tolerance 0.6 m — wide enough to accept "land near the goal" cases
      # when the exact frontier cell is borderline-lethal, but not so wide
      # that the NavFn tolerance search sweeps cells off the costmap edge.
      # A larger tolerance (we had 1.5) generated hundreds of
      # `worldToMap failed` log lines per goal whenever a frontier was
      # near the map boundary.
      # 1.0 m: when "return to start" lands on a cell that is now near a
      # mapped wall (start was captured before SLAM thickened the walls), this
      # lets NavFn accept the nearest reachable free cell instead of aborting
      # with "failed to create plan". Home is an interior goal (not near the map
      # edge), so the larger tolerance search won't hit the worldToMap-spam that
      # 1.5 caused at frontier goals near the boundary.
      tolerance: 1.0
      # A* (directed) sometimes finds a valid path through marginal-cost
      # cells where the Dijkstra potential-field flood stalls.
      use_astar: true
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 1.0
    simulate_ahead_time: 2.0
    # Spin/backup recoveries previously jerked at 0.6 rad/s² — that was
    # the loudest yaw event during planning failures. Match the DWB
    # angular budget so recoveries feel like the rest of motion.
    max_rotational_vel: 0.20
    min_rotational_vel: 0.08
    rotational_acc_lim: 0.25

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.15, 0.15, 0.20]
    # Match DWB: tiny reverse band for recovery escape only.
    min_velocity: [-0.05, -0.15, -0.20]
    max_accel: [0.4, 0.4, 0.20]
    max_decel: [-0.4, -0.4, -0.20]
    odom_topic: /r100_0140/platform/odom/filtered
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
