# Per-node parameters for the Ridgeback + Jetson autonomy stack.
# All node names are unnamespaced — these are the names declared in each node's
# super().__init__() call. Topic names default to /r100_0140/... where applicable.

# Ridgeback-side only. scripts/ridgeback_start.sh runs this bridge. Jetson
# publishes /cmd_vel/mux_out; motion_server injects it into Clearpath's native
# /<namespace>/cmd_vel input, and /<namespace>/twist_mux remains the only
# publisher on /<namespace>/platform/cmd_vel_unstamped.
motion_server:
  ros__parameters:
    namespace: r100_0140
    input_topic: /cmd_vel/mux_out
    output_topic: ""        # auto: /<namespace>/cmd_vel (twist_mux input)
    max_linear: 0.6
    max_lateral: 0.6
    max_angular: 1.5
    watchdog_timeout_s: 0.7
    publish_rate_hz: 50.0

safety_controller:
  ros__parameters:
    heartbeat_topic: /operator/heartbeat
    liveness_topic: /platform/liveness
    safety_latched_topic: /safety/latched
    safety_reset_service: /safety/reset
    safety_override_topic: /safety/override
    heartbeat_timeout_s: 3.0
    liveness_timeout_s: 5.0
    publish_rate_hz: 20.0
    require_reset: false
    # Holonomic LiDAR FOV obstacle check. Publishes a per-axis Boolean
    # veto mask on fov_block_topic; cmd_vel_mux zeroes any blocked axis.
    # Ridgeback's 2D LiDAR covers ~270° — the rear ~90° sector is NOT
    # measured, so minus_x is always reported clear here.
    scan_topic: ""                  # auto: /<namespace>/sensors/lidar2d_0/scan
    namespace: r100_0140
    fov_block_topic: /safety/fov_block
    # NOTE: these clearances are measured as RAW LiDAR range from the robot
    # CENTER (safety_controller compares range < clearance directly; it does
    # NOT add the footprint). Because lateral 0.35 < half-width 0.40 and
    # forward 0.45 < half-length 0.48, this veto only fires when an obstacle
    # is essentially inside the body -> it does NOT block doorway traversal,
    # and it is also a very weak forward safety backstop (fires ~at contact).
    # Left at original values; the FOV layer needs an edge-referenced redesign
    # (clearance = range - footprint_extent) to be a real bystander backstop.
    fov_min_clearance_forward_m: 0.45
    fov_min_clearance_lateral_m: 0.35
    fov_min_clearance_rot_m: 0.30
    fov_block_hysteresis_s: 0.30
    fov_scan_max_age_s: 0.5

cmd_vel_mux:
  ros__parameters:
    teleop_topic: /cmd_vel/teleop
    nav_topic: /cmd_vel/nav
    output_topic: /cmd_vel/mux_out
    safety_latched_topic: /safety/latched
    teleop_timeout_s: 0.4
    nav_timeout_s: 0.5
    publish_rate_hz: 50.0
    # Slow-mode caps applied while /safety/latched=true. Robot stays
    # steerable but is rate-limited so accidental commands don't cause harm.
    slow_max_linear: 0.10
    slow_max_lateral: 0.10
    slow_max_angular: 0.30
    # Per-axis obstacle veto driven by safety_controller's LiDAR FOV check.
    fov_block_topic: /safety/fov_block
    fov_block_apply: true

jetson_watchdog:
  ros__parameters:
    namespace: r100_0140
    ridgeback_ip: 192.168.131.1
    liveness_topic: /platform/liveness
    status_topic: ""        # auto: /<namespace>/platform/mcu/status
    odom_topic: ""          # auto: /<namespace>/platform/odom/filtered
    ping_period_s: 1.0
    liveness_grace_s: 2.5
    ping_timeout_s: 0.7

frontier_explorer:
  ros__parameters:
    map_topic: /map
    status_topic: /frontier/status
    cancel_topic: /frontier/cancel
    hint_topic: /frontier/hint
    nav_action: navigate_to_pose
    base_frame: ""                  # auto: base_link (matches orchestrator)
    home_frame: map
    min_frontier_size_cells: 10
    goal_blacklist_radius_m: 0.5
    replan_period_s: 6.0
    max_attempts_per_goal: 2
    goal_padding_m: 0.3
    # Weighted scoring: pick the frontier with the largest info gain per
    # meter, penalised by recency of visits and proximity to blacklist.
    # If best_score < min_score_threshold, publish state="no_frontiers"
    # so the orchestrator can transition to IDLE_MAP_COMPLETE.
    score_w_info_gain: 1.0
    score_w_distance: 0.6
    score_w_recency: 0.4
    score_w_blacklist_prox: 0.8
    score_w_hint_align: 0.5
    recency_window_s: 60.0
    info_gain_radius_m: 2.0
    max_distance_cap_m: 8.0
    min_score_threshold: 0.10

mission_orchestrator:
  ros__parameters:
    namespace: r100_0140
    home_frame: map
    base_frame: ""          # auto: <namespace>/base_link
    goal_topic: /mission/goal
    state_topic: /mission/state
    home_topic: /mission/home_pose
    frontier_cancel_topic: /frontier/cancel
    frontier_status_topic: /frontier/status
    vlm_trigger_topic: /vlm/trigger
    vlm_observation_topic: /vlm/observation
    memory_query_topic: /memory/query
    memory_result_topic: /memory/result
    safety_latched_topic: /safety/latched
    nav_action: navigate_to_pose
    periodic_vlm_period_s: 3.0
    target_match_confidence: 0.7
    max_explore_time_s: 600.0
    approach_offset_m: 0.8
    memory_lookup_timeout_s: 1.0
    tick_period_s: 1.0
    # Frontier hint to bias exploration toward a directional preference
    # (e.g. unknown target room). Empty hint = no bias (default scoring).
    frontier_hint_topic: /frontier/hint
    # When the frontier explorer reports no_frontiers while EXPLORING, switch
    # to IDLE_MAP_COMPLETE instead of ABORTED. The map is closed; the operator
    # can issue a new goal or RETURN_TO_START.
    enter_idle_on_no_frontiers: true

spatial_memory:
  ros__parameters:
    db_path: ~/.ridgeback/spatial_memory.sqlite
    min_confidence: 0.6
    dedup_radius_m: 1.0
    observation_topic: /vlm/observation
    query_topic: /memory/query
    result_topic: /memory/result

vlm_client:
  ros__parameters:
    namespace: r100_0140
    color_topic: ""         # auto: /<namespace>/sensors/camera_0/color/image_raw
    odom_topic: ""          # auto: /<namespace>/platform/odom/filtered
    trigger_topic: /vlm/trigger
    observation_topic: /vlm/observation
    home_frame: map
    base_frame: ""          # auto: <namespace>/base_link
    # Deployment .env wins over these defaults:
    #   VLM_ENDPOINT=http://202.92.159.240
    #   VLM_PORT=8000
    #   VLM_MODEL_NAME=Qwen/Qwen3.6-27B
    #   VLM_THINK=false
    vlm_url: http://202.92.159.240:8000/v1
    vlm_model: Qwen/Qwen3.6-27B
    api_key_env: VLM_API_KEY
    period_s: 3.0
    motion_threshold_mps: 0.05
    jpeg_quality: 80
    request_timeout_s: 8.0
    prompt: |
      You are a building navigator. Look at this image and extract any visible
      room number sign or door plate (e.g. '202', 'B312', '101A').
      Reply with strict JSON only:
      {"room": "<string or empty>", "confidence": <0..1>, "reason": "<short note>"}.

ridgeback_dashboard:
  ros__parameters:
    namespace: r100_0140
    scan_topic: ""          # auto: /<namespace>/sensors/lidar2d_0/scan
    odom_topic: ""          # auto: /<namespace>/platform/odom/filtered
    battery_topic: ""       # auto: /<namespace>/platform/bms/state
    color_image_topic: ""   # auto: /<namespace>/sensors/camera_0/color/image_raw
    depth_image_topic: ""   # auto: /<namespace>/sensors/camera_0/aligned_depth_to_color/image_raw
    map_topic: /map
    teleop_topic: /cmd_vel/teleop
    heartbeat_topic: /operator/heartbeat
    safety_latched_topic: /safety/latched
    safety_reset_service: /safety/reset
    safety_override_topic: /safety/override
    mission_state_topic: /mission/state
    mission_goal_topic: /mission/goal
    frontier_status_topic: /frontier/status
    vlm_observation_topic: /vlm/observation
    vlm_trigger_topic: /vlm/trigger
    teleop_max_linear: 0.5
    teleop_max_lateral: 0.5
    teleop_max_angular: 1.5
    dashboard_keepalive_period_s: 0.5
    dashboard_keepalive_window_s: 30.0
    fov_block_topic: /safety/fov_block
